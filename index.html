<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12082B">
<title>今晚你是哪一攤？夜市小吃人格測驗</title>
<meta name="description" content="回答 10 個問題，看看你是夜市裡的哪一攤。珍奶、雞排、臭豆腐、蚵仔煎…8 種夜市小吃，你是哪一種？">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="今晚你是哪一攤？夜市小吃人格測驗">
<meta property="og:description" content="回答 10 個問題，看看你是夜市裡的哪一攤。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 92'%3E%3Crect x='20' y='5' width='20' height='7' rx='2.5' fill='%23FFD23F'/%3E%3Cellipse cx='30' cy='42' rx='26' ry='30' fill='%23FF3B5C'/%3E%3Crect x='20' y='70' width='20' height='7' rx='2.5' fill='%23FFD23F'/%3E%3Cpath d='M30 77V90' stroke='%23FFD23F' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== 變數 ===== */
:root{
  --night:#12082B; --night-2:#1E1145;
  --neon-red:#FF3B5C; --neon-yellow:#FFD23F; --neon-green:#39FF88; --neon-cyan:#2EE6FF;
  --paper:#FFF6E5; --ink:#2A1A0F;
  --f-title:"Huninn","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px);
}

/* ===== 基礎 ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--night)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--night);color:var(--paper);
  font:400 1rem/1.7 var(--f-body);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:3px solid var(--neon-cyan);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* 背景光暈與星點 */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(70vmax 50vmax at 12% 6%,rgba(255,59,92,.30),transparent 70%),
    radial-gradient(60vmax 45vmax at 92% 18%,rgba(255,210,63,.16),transparent 70%),
    radial-gradient(80vmax 55vmax at 50% 108%,rgba(255,110,60,.26),transparent 70%),
    radial-gradient(50vmax 40vmax at 85% 70%,rgba(46,230,255,.08),transparent 70%),
    var(--night)}
.stars,.stars::after{position:fixed;inset:0;z-index:0;pointer-events:none;background-repeat:repeat}
.stars{background-size:300px 260px;opacity:.7;animation:twinkle 4s ease-in-out infinite;
  background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 140px,#fff,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#ffe9a8,transparent),radial-gradient(1px 1px at 230px 200px,#fff,transparent),radial-gradient(1px 1px at 50px 220px,#cfe9ff,transparent),radial-gradient(1.5px 1.5px at 280px 110px,#fff,transparent)}
.stars::after{content:"";background-size:380px 340px;opacity:.6;animation:twinkle 5.5s ease-in-out -2s infinite reverse;
  background-image:radial-gradient(1px 1px at 60px 70px,#fff,transparent),radial-gradient(1.5px 1.5px at 200px 20px,#ffe9a8,transparent),radial-gradient(1px 1px at 310px 160px,#fff,transparent),radial-gradient(1.5px 1.5px at 130px 250px,#fff,transparent),radial-gradient(1px 1px at 350px 300px,#cfe9ff,transparent),radial-gradient(1px 1px at 20px 310px,#fff,transparent)}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.85}}

/* ===== 版面 ===== */
.app{position:relative;z-index:1;width:100%;max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(64px + var(--safe-t)) max(16px,var(--safe-l)) calc(36px + var(--safe-b)) max(16px,var(--safe-r))}
.screen{display:none}
.screen.active{display:block;animation:screenIn .4s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.center{text-align:center}

/* ===== 音訊開關 ===== */
.ctl-wrap{position:fixed;top:calc(10px + var(--safe-t));right:calc(10px + var(--safe-r));z-index:30;display:flex;gap:8px}
.ctl{width:44px;height:44px;border-radius:50%;border:2px solid var(--neon-cyan);background:rgba(18,8,43,.85);color:var(--neon-cyan);
  display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 0 10px rgba(46,230,255,.35)}
.ctl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctl .slash{display:none}
.ctl[aria-pressed="false"]{border-color:rgba(255,246,229,.4);color:rgba(255,246,229,.7);box-shadow:none}
.ctl[aria-pressed="false"] .slash{display:block}

/* ===== Logo 招牌 ===== */
.logo{display:flex;align-items:flex-start;justify-content:center;gap:6px;width:100%}
.logo .lan{width:clamp(34px,10vw,48px);flex:none;transform-origin:50% 0;animation:swing 3s ease-in-out infinite}
.logo .lan:last-child{animation-delay:-1.5s}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.sign{flex:1;min-width:0;text-align:center;margin-top:16px;padding:.85rem .5rem .75rem;
  border:3px solid var(--neon-red);border-radius:18px;background:rgba(18,8,43,.55);
  box-shadow:0 0 6px var(--neon-red),0 0 16px rgba(255,59,92,.75),0 0 38px rgba(255,59,92,.45),inset 0 0 14px rgba(255,59,92,.4)}
.sign-title{font-family:var(--f-title);font-weight:400;color:var(--neon-yellow);font-size:clamp(1.75rem,6vw,3rem);line-height:1.2;
  text-shadow:0 0 3px #fff4b8,0 0 10px var(--neon-yellow),0 0 22px rgba(255,210,63,.85),0 0 42px rgba(255,210,63,.5)}
.sign-sub{margin-top:.35rem;color:var(--neon-cyan);font-size:clamp(.56rem,2.5vw,.72rem);letter-spacing:.2em;line-height:1.5;
  text-shadow:0 0 6px rgba(46,230,255,.9),0 0 14px rgba(46,230,255,.5)}
.sign-title.flick{animation:flick .55s steps(1) 1}
@keyframes flick{0%{opacity:1}8%{opacity:.3}16%{opacity:1}28%{opacity:.15}38%{opacity:.9}52%{opacity:.35}66%{opacity:1}100%{opacity:1}}
.compact .sign-title{font-size:clamp(1.3rem,5vw,1.9rem)}
.compact .sign{margin-top:10px;padding:.55rem .4rem .5rem}
.compact .lan{width:clamp(26px,7vw,34px)}

/* ===== 按鈕 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;min-width:44px;padding:.7rem 1.8rem;
  border:0;border-radius:999px;background:var(--neon-red);color:var(--night);font:700 1.1rem/1.3 var(--f-body);cursor:pointer;text-decoration:none;
  box-shadow:0 0 14px rgba(255,59,92,.7),0 4px 0 #9C1F38;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 0 10px rgba(255,59,92,.7),0 1px 0 #9C1F38}
.btn.big{font-size:1.25rem;padding:.85rem 2.4rem}
.sbtn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;min-width:44px;padding:.5rem 1.1rem;border-radius:999px;
  border:2px solid var(--neon-cyan);background:rgba(30,17,69,.85);color:var(--neon-cyan);font:700 .95rem/1.2 var(--f-body);cursor:pointer;text-decoration:none}
.sbtn.line{border-color:var(--neon-green);color:var(--neon-green)}
.sbtn.fb{border-color:var(--neon-yellow);color:var(--neon-yellow)}
.sbtn:active{transform:scale(.96)}
@media (hover:hover){.sbtn:hover{background:#2A1A5C}.btn:hover{filter:brightness(1.08)}}

/* ===== 圓形展示徽章（淺底讓深褐描邊清楚） ===== */
.badge{border-radius:50%;display:grid;place-items:center;aspect-ratio:1;
  background:radial-gradient(circle at 50% 38%,#FFFBF0,#FFE3A8 72%);
  box-shadow:0 0 0 4px var(--neon-yellow),0 0 28px rgba(255,210,63,.7)}
.badge svg{width:84%;height:84%;overflow:visible}

/* ===== 開場頁 ===== */
.intro-lead{margin:1.6rem 0 1rem;font-size:1.1rem;color:var(--paper);text-align:center}
.carousel{width:min(54vw,210px);margin:0 auto}
.carousel .badge{width:100%;animation:carIn .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes carIn{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}
.car-name{margin-top:.8rem;font-family:var(--f-title);font-size:1.3rem;color:var(--neon-yellow);min-height:2rem;text-align:center;text-shadow:0 0 10px rgba(255,210,63,.6)}
.strip{display:none;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 auto;max-width:360px}
.strip .badge{width:72px;box-shadow:0 0 0 3px var(--neon-yellow)}
.intro-meta{margin-top:.9rem;font-size:.9rem;color:rgba(255,246,229,.8);text-align:center}
.start-wrap{margin-top:1.2rem;text-align:center}

/* ===== 題目頁 ===== */
.quiz-top{display:flex;align-items:center;min-height:44px}
.back{min-height:44px;min-width:44px;padding:.4rem .9rem;border-radius:999px;border:2px solid rgba(255,246,229,.4);background:transparent;color:var(--paper);cursor:pointer;font-weight:700}
.back:active{transform:scale(.96)}
.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:.8rem 0 1rem;justify-items:center}
.pl{width:100%;max-width:30px}
.pl svg{width:100%;height:auto}
.pl .body{fill:#3B2D63;stroke:#5B4A8C;stroke-width:1.5;transition:fill .3s}
.pl .cap{fill:#5B4A8C;transition:fill .3s}
.pl .tas{stroke:#5B4A8C;stroke-width:1.6;stroke-linecap:round;transition:stroke .3s}
.pl.lit{filter:drop-shadow(0 0 5px var(--neon-red)) drop-shadow(0 0 10px rgba(255,59,92,.7));animation:pop .4s ease}
.pl.lit .body{fill:var(--neon-red);stroke:#FFB3C0}
.pl.lit .cap{fill:var(--neon-yellow)}
.pl.lit .tas{stroke:var(--neon-yellow)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.qnum{color:var(--neon-yellow);font-weight:700;letter-spacing:.08em;font-size:.95rem}
.qcard.enter{animation:fadeUp .4s ease both}
.qtitle{font-family:var(--f-title);font-weight:400;font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.4;margin:.3rem 0 1.2rem}
.opts{display:grid;grid-template-columns:1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:64px;padding:.75rem 1rem;border-radius:16px;
  border:2px solid rgba(255,246,229,.2);background:var(--night-2);color:var(--paper);font:400 1.05rem/1.5 var(--f-body);cursor:pointer;
  transition:border-color .15s,box-shadow .2s,background .2s,transform .12s}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;background:var(--neon-yellow);color:var(--night);font-weight:700;display:grid;place-items:center;font-size:.95rem}
.opt:active{transform:scale(.98)}
.opt.picked{border-color:var(--neon-cyan);background:#2A1A5C;box-shadow:0 0 0 1px var(--neon-cyan),0 0 18px rgba(46,230,255,.65),inset 0 0 14px rgba(46,230,255,.22)}
.opt:disabled{cursor:default}
.opt:disabled:not(.picked){opacity:.55}
@media (hover:hover){.opt:not(:disabled):hover{border-color:var(--neon-cyan)}}
.keyhint{margin-top:1rem;font-size:.82rem;color:rgba(255,246,229,.65);text-align:center;display:none}
@media (hover:hover) and (pointer:fine){.keyhint{display:block}}

/* ===== 計算頁 ===== */
.calc{text-align:center;padding-top:8vh}
.wok{width:min(60vw,240px);margin:0 auto 1rem}
.calc h2{font-family:var(--f-title);font-weight:400;font-size:clamp(1.4rem,5vw,1.9rem);color:var(--neon-yellow);text-shadow:0 0 12px rgba(255,210,63,.6)}
.calc p{margin-top:.5rem;color:rgba(255,246,229,.8)}

/* ===== 結果頁 ===== */
.you{margin-top:1.1rem;text-align:center;color:var(--neon-cyan);letter-spacing:.2em;font-weight:700}
.flip{width:min(60vw,230px);aspect-ratio:1;perspective:900px;margin:.7rem auto 0}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flipIn 1.1s .1s cubic-bezier(.25,1,.4,1) both}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);border-radius:50%;background:var(--night-2);display:grid;place-items:center;
  box-shadow:0 0 0 4px var(--neon-red),0 0 26px rgba(255,59,92,.7)}
.face.back svg{width:42%}
@keyframes flipIn{from{transform:rotateY(540deg)}to{transform:rotateY(0)}}
.rv{animation:fadeUp .6s both;animation-delay:calc(var(--i,0) * .16s + 1.1s)}
.res-name{margin-top:1rem;text-align:center;font-family:var(--f-title);font-weight:400;line-height:1.25}
.res-name .n{display:block;font-size:clamp(2rem,8vw,2.8rem);color:var(--paper);text-shadow:0 0 14px rgba(255,59,92,.8)}
.res-name .t{display:block;font-size:clamp(1.3rem,5vw,1.7rem);color:var(--neon-yellow);text-shadow:0 0 12px rgba(255,210,63,.7)}
.desc{margin-top:1rem;text-align:center}
.cards{display:grid;grid-template-columns:1fr;gap:12px;margin-top:1.1rem}
@media (min-width:481px){.cards.two{grid-template-columns:1fr 1fr}}
.card{padding:.85rem 1rem;border-radius:16px;background:var(--night-2);border:2px solid rgba(255,246,229,.16)}
.tag{display:inline-block;font-weight:700;font-size:.85rem;letter-spacing:.1em;margin-bottom:.15rem}
.tag.g{color:var(--neon-green)} .tag.r{color:var(--neon-red)} .tag.y{color:var(--neon-yellow)} .tag.c{color:var(--neon-cyan)}
.card.pros{border-color:rgba(57,255,136,.45)} .card.cons{border-color:rgba(255,59,92,.5)}
.pair{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.pair .badge{width:64px;box-shadow:0 0 0 3px var(--neon-yellow)}
.pair b{font-size:1.05rem}
.card.best{border-color:rgba(57,255,136,.45)} .card.worst{border-color:rgba(255,59,92,.5)}
.quote{margin-top:1.3rem;padding:.9rem .8rem;text-align:center;font-family:var(--f-title);font-size:clamp(1.15rem,4.4vw,1.4rem);line-height:1.5;
  color:var(--neon-yellow);border-top:2px dashed rgba(255,210,63,.5);border-bottom:2px dashed rgba(255,210,63,.5);text-shadow:0 0 12px rgba(255,210,63,.55)}
.sect-title{margin:1.5rem 0 .6rem;font-family:var(--f-title);font-weight:400;font-size:1.2rem;color:var(--neon-cyan)}
.barrow{margin-bottom:.7rem}
.barlbl{display:flex;justify-content:space-between;font-weight:700;margin-bottom:.2rem}
.bar{height:16px;border-radius:8px;background:rgba(255,246,229,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;transition:width 1s cubic-bezier(.2,.8,.2,1) 1.9s}
.share-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.share-note{margin-top:.7rem;font-size:.85rem;text-align:center;color:rgba(255,246,229,.75)}
.again-wrap{margin-top:1.6rem;text-align:center}

/* ===== 桌機兩側燈籠串 ===== */
.side{display:none}
@media (min-width:769px){
  .side{display:flex;flex-direction:column;align-items:center;gap:30px;position:fixed;top:0;z-index:0;width:64px;padding-top:0;pointer-events:none}
  .side.l{left:max(8px,calc(50% - 280px - 110px))}
  .side.r{right:max(8px,calc(50% - 280px - 110px))}
  .side::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:linear-gradient(rgba(255,210,63,.55),rgba(255,210,63,.1))}
  .side .sw{position:relative;width:56px;transform-origin:50% 0;animation:swingInt 7s ease-in-out infinite;animation-delay:var(--d,0s)}
  .side .sw:nth-child(2){width:48px;margin-top:20px}
  .side .sw:nth-child(3){width:60px}
  .side .sw:nth-child(4){width:44px}
}
@keyframes swingInt{0%,55%,100%{transform:rotate(0)}8%{transform:rotate(9deg)}18%{transform:rotate(-8deg)}28%{transform:rotate(5deg)}38%{transform:rotate(-3deg)}48%{transform:rotate(1deg)}}

/* ===== SVG 圖示小動畫 ===== */
svg [class^="a-"]{transform-box:fill-box;transform-origin:center}
.a-pearl{animation:bob 1.5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.a-steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(7px)}40%{opacity:.95}100%{opacity:0;transform:translateY(-8px)}}
.a-stink{animation:stink 2.6s ease-in-out infinite}
@keyframes stink{0%{opacity:0;transform:translateY(8px) scaleX(.8)}45%{opacity:1;transform:translateY(-2px) scaleX(1.1)}100%{opacity:0;transform:translateY(-10px) scaleX(.9)}}
.a-shine{animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,65%,100%{opacity:0}80%{opacity:1}}
.a-bounce{animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.04,.94)}50%{transform:translateY(-11px) scale(1)}}
.a-sway{animation:sway 2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.a-spark{animation:spark .7s ease-in-out infinite alternate}
@keyframes spark{from{transform:scale(.7);opacity:.6}to{transform:scale(1.2);opacity:1}}
.a-spoon{animation:spoon 3s ease-in-out infinite alternate}
@keyframes spoon{from{transform:translateY(-3px) rotate(-6deg)}to{transform:translateY(3px) rotate(6deg)}}
.a-spat{transform-origin:50% 0;animation:spat .8s ease-in-out infinite alternate}
@keyframes spat{from{transform:translateY(-4px) rotate(-8deg)}to{transform:translateY(14px) rotate(8deg)}}

/* ===== 斷點 ===== */
@media (min-width:481px) and (max-width:768px){.opts{grid-template-columns:1fr 1fr}.opt{min-height:96px}}
@media (min-width:769px){.opts{grid-template-columns:1fr 1fr}.opt{min-height:96px}}

/* ===== 減少動態效果 ===== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .carousel,.car-name{display:none}
  .strip{display:flex}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>
<div class="side l" id="sideL" aria-hidden="true"></div>
<div class="side r" id="sideR" aria-hidden="true"></div>

<div class="ctl-wrap">
  <button class="ctl" id="btnMusic" type="button" aria-pressed="true" aria-label="背景音樂" title="音樂">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="slash" d="M3 3l18 18"/></svg>
  </button>
  <button class="ctl" id="btnSfx" type="button" aria-pressed="true" aria-label="音效" title="音效">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/><path class="slash" d="M3 3l18 18"/></svg>
  </button>
</div>

<main class="app">
  <!-- 1. 開場頁 -->
  <section class="screen active" id="s-intro" aria-labelledby="introTitle">
    <div class="logo" data-logo="h1"></div>
    <p class="intro-lead" id="introLead">回答 10 個問題，看看你是夜市裡的哪一攤。</p>
    <div class="carousel" aria-hidden="true"><div class="badge" id="car"></div><div class="car-name" id="carName"></div></div>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <p class="intro-meta">10 題・約 2 分鐘・8 種夜市小吃</p>
    <div class="start-wrap"><button class="btn big" id="btnStart" type="button">開始逛夜市</button></div>
  </section>

  <!-- 2. 題目頁 -->

/* =====================================================
   3. 音訊模組（Web Audio 即時合成）
   ===================================================== */
const Sound = (() => {
  const BPM = 96, SD = 60 / BPM / 2;           // 八分音符長度
  const F = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880]; // C4 D4 E4 G4 A4 C5 D5 E5 G5 A5
  const MEL = ['5-653-43', '2-3-2-0.', '5-6578-6', '5---3-..', '8-785-65', '3-4-3-2-', '5-6-7-8-', '5-3-0---'];
  const ROOTS = [130.81, 130.81, 110, 110, 130.81, 110, 98, 130.81];
  const EV = [];
  MEL.forEach(bar => { for (let i = 0; i < 8; i++) {
    const ch = bar[i]; if (ch >= '0' && ch <= '9') { let d = 1; while (bar[i + d] === '-') d++; EV.push({ f: F[+ch], d }); } else EV.push(null);
  } });

  let ctx, musicG, sfxG, noiseBuf, timer = null, stopT = 0, nextT = 0, step = 0, started = false;
  const st = { music: true, sfx: true };
  try { const s = JSON.parse(localStorage.getItem('nm-audio') || '{}'); if (typeof s.music === 'boolean') st.music = s.music; if (typeof s.sfx === 'boolean') st.sfx = s.sfx; } catch (e) {}
  const save = () => { try { localStorage.setItem('nm-audio', JSON.stringify(st)); } catch (e) {} };

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ctx = new AC();
      musicG = ctx.createGain(); musicG.gain.value = 0; musicG.connect(ctx.destination);
      sfxG = ctx.createGain(); sfxG.gain.value = 0.3; sfxG.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(type, f0, t, dur, vol, dest, f1) {
    const os = ctx.createOscillator(), g = ctx.createGain();
    os.type = type; os.frequency.setValueAtTime(f0, t);
    if (f1) os.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.linearRampToValueAtTime(0, t + dur);
    os.connect(g); g.connect(dest); os.start(t); os.stop(t + dur + 0.03);
  }
  function tick(t, vol) {              // 木魚：短噪音 + 帶通濾波
    const s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = 1300; bp.Q.value = 9;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.linearRampToValueAtTime(0, t + 0.06);
    s.connect(bp); bp.connect(g); g.connect(musicG); s.start(t, Math.random()); s.stop(t + 0.08);
  }
  function scheduleStep(i, t) {
    const e = EV[i], pos = i & 7, bar = i >> 3;
    if (e) tone('triangle', e.f, t, e.d * SD * 0.95, 0.45, musicG);
    if (pos === 0) tone('sine', ROOTS[bar], t, SD * 3.6, 0.6, musicG);
    if (pos === 4) tone('sine', ROOTS[bar] * 1.5, t, SD * 3.6, 0.45, musicG);
    if (pos % 2 === 0) tick(t, pos === 0 || pos === 4 ? 0.5 : 0.28);
  }
  function pump() { while (nextT < ctx.currentTime + 0.12) { scheduleStep(step, nextT); nextT += SD; step = (step + 1) % EV.length; } }

  function stopSched() { clearInterval(timer); timer = null; }

    if (!ctx) return;
    const want = st.music && started && !document.hidden, t = ctx.currentTime;
    clearTimeout(stopT);
    musicG.gain.cancelScheduledValues(t); musicG.gain.setValueAtTime(musicG.gain.value, t);
    if (want) { musicG.gain.linearRampToValueAtTime(0.12, t + 0.5); startSched(); }
    else if (document.hidden) { musicG.gain.setValueAtTime(0, t); stopSched(); }
    else { musicG.gain.linearRampToValueAtTime(0, t + 0.5); stopT = setTimeout(stopSched, 550); }
  }

  const api = {
    state: st,
    unlock() { ensure(); },
    start() { if (!ensure()) return; started = true; applyMusic(); },
    setMusic(on) { st.music = on; save(); if (on && ensure()) started = true; applyMusic(); },
    setSfx(on) { st.sfx = on; save(); if (on) ensure(); },
    visibility() { applyMusic(); },
    click() { if (!sfxOK()) return; tone('sine', 800, ctx.currentTime, 0.08, 0.8, sfxG, 1200); },
    choose() { if (!sfxOK()) return; const t = ctx.currentTime; tone('triangle', 659.25, t, 0.1, 0.8, sfxG); tone('triangle', 880, t + 0.1, 0.1, 0.8, sfxG); },
    back() { if (!sfxOK()) return; const t = ctx.currentTime; tone('triangle', 880, t, 0.1, 0.8, sfxG); tone('triangle', 659.25, t + 0.1, 0.1, 0.8, sfxG); },
    copied() { if (!sfxOK()) return; const t = ctx.currentTime; tone('sine', 1500, t, 0.06, 0.7, sfxG); tone('sine', 1500, t + 0.09, 0.06, 0.7, sfxG); },

    reveal() {
      if (!sfxOK()) return;

      tone('sine', 1046.5, t + 0.6, 0.6, 0.6, sfxG); tone('sine', 2093, t + 0.6, 0.6, 0.25, sfxG);

/* =====================================================
   4. 測驗邏輯
   ===================================================== */
const screens = $$('.screen');
let current = 'intro', qIndex = 0, answers = [], locked = false, pickTimer = 0, calcTimer = 0, lastRank = null, lastCode = null;

function show(name) {
  current = name;
  screens.forEach(s => s.classList.toggle('active', s.id === 's-' + name));
  window.scrollTo(0, 0);
  const h = $('#s-' + name + ' [data-focus]'); if (h) h.focus({ preventScroll: true });
}

function tally() {
  const s = {}, mc = {}, lm = {};
  IDS.forEach(k => { s[k] = 0; mc[k] = 0; lm[k] = -1; });
  answers.forEach((a, qi) => { s[a.main] += 2; mc[a.main]++; lm[a.main] = qi; s[a.sub] += 1; });
  return { s, mc, lm };
}
/* 排序：總分 → 主分次數 → 最後一次主分較晚者 */
function ranking() {
  const t = tally();
  return IDS.slice().sort((a, b) => (t.s[b] - t.s[a]) || (t.mc[b] - t.mc[a]) || (t.lm[b] - t.lm[a])).map(id => ({ id, s: t.s[id] }));
}
/* 前三名百分比：四捨五入並確保加總 100 */
function percents(top) {
  const tot = top.reduce((a, b) => a + b.s, 0) || 1;
  const raw = top.map(x => x.s / tot * 100), fl = raw.map(Math.floor);
  let rem = 100 - fl.reduce((a, b) => a + b, 0);
  raw.map((v, i) => [v - fl[i], i]).sort((a, b) => b[0] - a[0]).forEach(p => { if (rem > 0) { fl[p[1]]++; rem--; } });
  return fl;
}

function buildProgress() {
  $('#prog').innerHTML = Array.from({ length: 10 }, () => `<div class="pl">${miniLantern()}</div>`).join('');
}
function updateProgress() {
  const n = answers.length, prog = $('#prog');
  $$('.pl', prog).forEach((el, i) => { const lit = i < n, was = el.classList.contains('lit'); el.classList.toggle('lit', lit); if (lit && !was) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; } });
  prog.setAttribute('aria-valuenow', n);
}
function renderQuestion() {
  const q = QUESTIONS[qIndex];
  $('#qnum').textContent = `第 ${qIndex + 1} / ${QUESTIONS.length} 題`;
  $('#qtitle').textContent = q.q;
  $('#opts').innerHTML = q.options.map((op, i) => `<button class="opt" type="button" data-i="${i}"><span class="k" aria-hidden="true">${'ABCD'[i]}</span><span>${op.text}</span></button>`).join('');
  $('#btnBack').style.visibility = qIndex > 0 ? 'visible' : 'hidden';
  updateProgress();
  const card = $('#qcard'); card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');
  locked = false;
  $('#qtitle').focus({ preventScroll: true });
}
function startQuiz() {
  clearTimeout(pickTimer); clearTimeout(calcTimer);
  answers = []; qIndex = 0; locked = false;
  show('quiz'); renderQuestion();
}
function pick(i) {
  if (locked || current !== 'quiz') return;
  const op = QUESTIONS[qIndex].options[i]; if (!op) return;
  locked = true;
  const btns = $$('.opt'); btns.forEach((b, k) => { b.disabled = true; b.classList.toggle('picked', k === i); });
  answers[qIndex] = { main: op.main, sub: op.sub, idx: i };
  updateProgress();
  Sound.choose();
  pickTimer = setTimeout(() => {
    if (qIndex < QUESTIONS.length - 1) { qIndex++; renderQuestion(); } else showCalc();
  }, 500);
}
function goBack() {
  if (locked || qIndex === 0) return;
  qIndex--; answers.length = qIndex;       // 移除該題作答，分數由 tally() 重新計算而扣回
  Sound.back(); renderQuestion();
}
function showCalc() {
  show('calc'); Sound.sizzle();
  calcTimer = setTimeout(() => {
    const rank = ranking(); lastRank = rank.slice(0, 3);
    const pc = percents(lastRank); lastRank.forEach((r, i) => r.pct = pc[i]);
    renderResult(rank[0].id, lastRank, false);
  }, 2000);
}

  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok; };

}

  if (line) out.push(line); return out;
}

    // 招牌
    c.save(); c.strokeStyle = '#FF3B5C'; c.lineWidth = 7; c.shadowColor = '#FF3B5C'; c.shadowBlur = 36;
    c.beginPath(); c.roundRect ? c.roundRect(150, 150, 780, 170, 30) : c.rect(150, 150, 780, 170); c.stroke(); c.stroke(); c.restore();
    glow('今晚你是哪一攤？', 540, 250, '84px Huninn, "Microsoft JhengHei", sans-serif', '#FFD23F', 28);
    try { c.letterSpacing = '6px'; } catch (e) {}
    glow('NIGHT MARKET PERSONALITY TEST', 540, 297, '700 24px "Noto Sans TC", sans-serif', '#2EE6FF', 14);
    try { c.letterSpacing = '0px'; } catch (e) {}
    // 圖示
    c.save(); c.shadowColor = 'rgba(255,210,63,.8)'; c.shadowBlur = 50;
    const pg = c.createRadialGradient(540, 530, 20, 540, 560, 280); pg.addColorStop(0, '#FFFBF0'); pg.addColorStop(.75, '#FFE3A8'); pg.addColorStop(1, '#FFE3A8');
    c.fillStyle = pg; c.beginPath(); c.arc(540, 575, 262, 0, 7); c.fill(); c.restore();
    c.strokeStyle = '#FFD23F'; c.lineWidth = 8; c.beginPath(); c.arc(540, 575, 262, 0, 7); c.stroke();
    c.drawImage(icon, 300, 335, 480, 480);
    // 名稱
    glow(f.name, 540, 940, '96px Huninn, "Microsoft JhengHei", sans-serif', '#FFF6E5', 22);
    glow(f.title, 540, 1010, '52px Huninn, "Microsoft JhengHei", sans-serif', '#FFD23F', 18);
    // 金句
    c.font = '400 34px "Noto Sans TC", "Microsoft JhengHei", sans-serif'; c.fillStyle = '#FFF6E5';
    wrapText(c, `「${f.quote}」`, 860).forEach((ln, i) => c.fillText(ln, 540, 1080 + i * 48));
    if (comp) { c.font = '700 34px "Noto Sans TC", "Microsoft JhengHei", sans-serif'; c.fillStyle = '#2EE6FF'; c.fillText(comp, 540, 1205); }
    c.font = '400 26px "Noto Sans TC", "Microsoft JhengHei", sans-serif'; c.fillStyle = 'rgba(255,246,229,.75)';
    c.fillText(url.length > 56 ? url.slice(0, 55) + '…' : url, 540, 1290);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const href = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = href; a.download = `night-market-${code}.png`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 5000);
  } catch (err) { console.warn('下載結果卡失敗', err); btn.textContent = '下載失敗，請再試'; setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1600); return; }
  btn.textContent = old; btn.disabled = false;
}
function nativeShare() {
  const f = FOODS[lastCode];
  navigator.share({ title: '今晚你是哪一攤？', text: shareText(lastCode).split('\n')[0], url: resultUrl(lastCode) }).catch(() => {});
}

/* =====================================================
   6. 初始化
   ===================================================== */
function logoHTML(tag) {
  return `<div class="lan">${lantern()}</div><div class="sign"><${tag} class="sign-title"${tag === 'h1' ? ' id="introTitle" tabindex="-1" data-focus' : ''}>今晚你是哪一攤？</${tag}><div class="sign-sub">NIGHT MARKET PERSONALITY TEST</div></div><div class="lan">${lantern()}</div>`;
}
function syncAudioUI() {
  const m = $('#btnMusic'), s = $('#btnSfx');
  m.setAttribute('aria-pressed', Sound.state.music); m.setAttribute('aria-label', '背景音樂：' + (Sound.state.music ? '開' : '關'));
  s.setAttribute('aria-pressed', Sound.state.sfx); s.setAttribute('aria-label', '音效：' + (Sound.state.sfx ? '開' : '關'));
}
function init() {
  $$('[data-logo]').forEach(el => { el.innerHTML = logoHTML(el.dataset.logo); });
  $('#sideL').innerHTML = [0, -2.3, -4.6, -1.2].map(d => `<div class="sw" style="--d:${d}s">${lantern()}</div>`).join('');
  $('#sideR').innerHTML = [-3.4, -1, -5.5, -2.6].map(d => `<div class="sw" style="--d:${d}s">${lantern()}</div>`).join('');
  $('#wok').innerHTML = wokSVG();
  $('#strip').innerHTML = IDS.map(id => `<div class="badge">${FOODS[id].icon()}</div>`).join('');
  buildProgress(); syncAudioUI();

  // 8 種小吃圖示輪播
  let ci = 0;
  const car = $('#car'), carName = $('#carName');
  const swap = () => { const f = FOODS[IDS[ci]]; car.style.animation = 'none'; void car.offsetWidth; car.style.animation = ''; car.innerHTML = f.icon(); carName.textContent = f.name; ci = (ci + 1) % IDS.length; };
  swap(); if (!REDUCED) setInterval(() => { if (current === 'intro' && !document.hidden) swap(); }, 1800);

  // 招牌每 4 秒隨機閃爍一次
  if (!REDUCED) setInterval(() => setTimeout(() => $$('.sign-title').forEach(el => { el.classList.remove('flick'); void el.offsetWidth; el.classList.add('flick'); }), Math.random() * 3000), 4000);

  // 事件
  document.addEventListener('click', e => { if (e.target.closest('button,a.sbtn')) Sound.unlock(); }, true);
  $('#btnStart').addEventListener('click', () => { Sound.start(); Sound.click(); startQuiz(); });
  $('#btnBack').addEventListener('click', goBack);
  $('#opts').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) pick(+b.dataset.i); });
  document.addEventListener('keydown', e => {
    if (current !== 'quiz' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= '1' && e.key <= '4') { Sound.unlock(); pick(+e.key - 1); }
  });
  $('#btnMusic').addEventListener('click', () => { Sound.setMusic(!Sound.state.music); syncAudioUI(); Sound.click(); });
  $('#btnSfx').addEventListener('click', () => { Sound.setSfx(!Sound.state.sfx); syncAudioUI(); Sound.click(); });
  $('#resultBody').addEventListener('click', e => {
    const b = e.target.closest('[data-act],#btnAgain'); if (!b) return;
    if (b.id === 'btnAgain') { Sound.click(); restart(); return; }
    Sound.click();
    if (b.dataset.act === 'copy') doCopy(b);
    else if (b.dataset.act === 'download') downloadCard(b);
    else if (b.dataset.act === 'native') nativeShare();
  });
  document.addEventListener('visibilitychange', () => Sound.visibility());

  // 分享連結 ?r=代碼：直接顯示結果頁
  const r = new URLSearchParams(location.search).get('r');
  if (r && Object.prototype.hasOwnProperty.call(FOODS, r)) renderResult(r, null, true);
}
init();
})();
</script>
